# wf-component-research.yaml
# Workflow for deep research on UI components before implementation
# Matches Squad Creator Pro deep-research methodology

workflow:
  id: wf-component-research
  name: "Deep Component Research Loop"
  version: "1.0"
  purpose: "Research and validate component patterns across the industry before building them."
  orchestrator: "design-chief"
  mode: "autonomous"

philosophy:
  core: |
    "Don't reinvent the wheel if the wheel is accessible, proven, and standard."
    "Analyze the best-in-class implementations (Radix, MUI, Apple HIG, Material) before writing code."

inputs:
  required:
    - name: component_name
      type: string
      description: "Name of the component to research (e.g. 'Date Picker', 'Combobox')"

outputs:
  primary:
    - name: "research_report"
      format: "yaml"
      path: "outputs/research/{component_name}-research.yaml"

phases:
  - id: phase_1_broad_research
    name: "Broad Pattern Research"
    duration: "2-4 min"
    steps:
      - id: step_1_1
        name: "Industry Benchmarking"
        action: |
          Task(
            subagent: "brad-frost",
            prompt: "Research how '{{component_name}}' is implemented in 3 top design systems. Identify common properties, accessibility patterns, and UX interactions."
          )

  - id: phase_2_devils_advocate
    name: "Devil's Advocate"
    duration: "2 min"
    steps:
      - id: step_2_1
        name: "Self-Criticism"
        action: |
          Task(
            subagent: "nathan-curtis",
            prompt: "Review the research. Ask: 1) What edge cases did we miss? 2) Is this component actually too complex and should it be split?"
          )

  - id: phase_3_framework_validation
    name: "A11y & Token Validation"
    duration: "3 min"
    steps:
      - id: step_3_1
        name: "A11y Check"
        action: |
          Task(
            subagent: "heydon-pickering",
            prompt: "Validate the proposed component patterns against WCAG. Which ARIA roles are mandatory?"
          )
      - id: step_3_2
        name: "Token Check"
        action: |
          Task(
            subagent: "jina-anne",
            prompt: "Define the semantic tokens required to theme this component."
          )

  - id: phase_4_final_elite
    name: "Consolidated Specification"
    duration: "1 min"
    steps:
      - id: step_4_1
        name: "Compile Report"
        action: |
          Compile output of all 3 phases into `{component_name}-research.yaml` encompassing UX, A11y, and Tokens.

veto_conditions:
  - id: RES_VC_001
    trigger: "Missing WCAG validation"
    action: "BLOCK: Component cannot be researched without a11y mapping."
