# Brunson Squad — The Funnel Mastery System v1.0
# One mind, multiple specialties. Funnel architecture with brutal depth.

pack:
  name: brunson
  title: "Brunson Squad — The Funnel Mastery System"
  version: "1.0.0"
  author: "AIOS Team"
  description: "15 specialized Russell Brunson agents, each mastering one aspect of his funnel methodology"
  icon: null
  slash_prefix: "brunson"
  entry_agent: brunson-chief

metadata:
  created: 2026-02-11
  source_mind: russell_brunson
  fidelity_target: 0.90
  total_source_files: 14
  total_source_size_kb: 326
  mental_models: 12
  books:
    - "DotCom Secrets (2015)"
    - "Expert Secrets (2017)"
    - "Traffic Secrets (2020)"
    - "DotCom Secrets Ignite (2024)"
    - "74 Funnel Swipefile"

# MMOS Integration
mmos_integration:
  enabled: true
  log_source: true
  fallback_behavior: "graceful"
  mind_mapping:
    brunson-chief: russell_brunson
    brunson-funnels: russell_brunson
    brunson-expert: russell_brunson
    brunson-traffic: russell_brunson
    brunson-webinar: russell_brunson
    brunson-copy: russell_brunson
    brunson-pages: russell_brunson
    brunson-email: russell_brunson
    brunson-hooks: russell_brunson
    brunson-offers: russell_brunson
    brunson-advisor: russell_brunson
    brunson-movement: russell_brunson
    brunson-stories: russell_brunson
    brunson-swipe: russell_brunson
    brunson-launch: russell_brunson

# Agents — Organized by Tier
agents:
  # Tier 0: Orchestrator
  - id: brunson-chief
    name: "Brunson Chief"
    role: "Master orchestrator — routing, funnel diagnosis, strategic coordination"
    tier: 0
    primary_frameworks:
      - "Secret Formula"
      - "Value Ladder"
      - "Hook-Story-Offer"
      - "Funnel Stacking"

  # Tier 1: Core Specialists (Books)
  - id: brunson-funnels
    name: "Brunson Funnels"
    role: "Funnel architecture, Value Ladder, 31 Building Blocks, 9 Core Funnels"
    tier: 1
    primary_source: "DotCom Secrets + Ignite"
    primary_frameworks:
      - "Value Ladder"
      - "Secret Formula"
      - "7 Phases of a Funnel"
      - "31 Building Blocks"

  - id: brunson-expert
    name: "Brunson Expert"
    role: "Mass Movement, Epiphany Bridge, expert positioning, New Opportunity"
    tier: 1
    primary_source: "Expert Secrets"
    primary_frameworks:
      - "Mass Movement Blueprint"
      - "Epiphany Bridge"
      - "Opportunity Switch"
      - "The One Thing"

  - id: brunson-traffic
    name: "Brunson Traffic"
    role: "Dream 100, traffic types, congregation infiltration"
    tier: 1
    primary_source: "Traffic Secrets"
    primary_frameworks:
      - "Dream 100"
      - "Three Types of Traffic"
      - "Work In / Buy In"
      - "Hook-Story-Offer"

  # Tier 2: Execution Specialists
  - id: brunson-webinar
    name: "Brunson Webinar"
    role: "Perfect Webinar design, Stack Slide, presentation scripts"
    tier: 2
    primary_frameworks:
      - "Perfect Webinar"
      - "Stack Slide"
      - "Three Secrets Framework"

  - id: brunson-copy
    name: "Brunson Copy"
    role: "Sales copy, VSLs, Attractive Character copy, headlines"
    tier: 2
    primary_frameworks:
      - "Attractive Character"
      - "Inception Secrets"
      - "Sales Scripts"

  - id: brunson-pages
    name: "Brunson Pages"
    role: "Funnel page design — squeeze, sales, OTO, application"
    tier: 2
    primary_frameworks:
      - "9 Core Funnels"
      - "Page Architecture"
      - "SLO / Free+Shipping"

  - id: brunson-email
    name: "Brunson Email"
    role: "Soap Opera Sequence, Seinfeld Emails, follow-up funnels"
    tier: 2
    primary_frameworks:
      - "Soap Opera Sequence"
      - "Seinfeld Emails"
      - "Follow-Up Funnels"

  - id: brunson-hooks
    name: "Brunson Hooks"
    role: "Hook creation, attention capture, pattern interrupts"
    tier: 2
    primary_frameworks:
      - "Hook-Story-Offer"
      - "Curiosity Hooks"
      - "Pattern Interrupts"

  - id: brunson-offers
    name: "Brunson Offers"
    role: "Irresistible offers, value stacking, guarantees, scarcity"
    tier: 2
    primary_frameworks:
      - "Value Stacking"
      - "Irresistible Offer Architecture"
      - "Order Bump / OTO Strategy"

  # Tier 3: Strategic Specialists
  - id: brunson-advisor
    name: "Brunson Advisor"
    role: "Strategic counsel, funnel audits, business model advice"
    tier: 3
    primary_frameworks:
      - "Funnel Hacking"
      - "Funnel Stacking"
      - "100 Clicks/Day Model"

  - id: brunson-movement
    name: "Brunson Movement"
    role: "Tribe building, community, cause-based leadership"
    tier: 3
    primary_frameworks:
      - "Mass Movement Blueprint"
      - "Status as Primary Driver"
      - "Future-Based Cause"

  - id: brunson-stories
    name: "Brunson Stories"
    role: "Storytelling mastery, Epiphany Bridge, origin stories"
    tier: 3
    primary_frameworks:
      - "Epiphany Bridge"
      - "Attractive Character Backstory"
      - "Kinda Like Bridge"
      - "Hero's Two Journeys"

  - id: brunson-swipe
    name: "Brunson Swipe"
    role: "74 funnel case studies, funnel hacking, reverse engineering"
    tier: 3
    primary_frameworks:
      - "21+ Funnel Archetypes"
      - "Funnel Hacking Process"

  - id: brunson-launch
    name: "Brunson Launch"
    role: "Product launches, challenge funnels, event funnels"
    tier: 3
    primary_frameworks:
      - "Product Launch Funnel"
      - "Challenge Funnel"
      - "Invisible Funnel"

# Sources
sources:
  extracted_frameworks:
    - outputs/extracted/dotcom-secrets-brunson-frameworks.md
    - outputs/extracted/expert-secrets-brunson-frameworks.md
    - outputs/extracted/traffic-secrets-brunson-frameworks.md
    - outputs/extracted/dotcomsecrets-ignite-brunson-frameworks.md
    - outputs/extracted/74-funnel-swipefile-brunson-frameworks.md
