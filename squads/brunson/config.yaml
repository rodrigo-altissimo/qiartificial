# Veto Conditions (Centralized)
veto_conditions:
  config_file: config/veto-conditions.yaml
  enforcement: strict
  tiers:
    tier_0_universal: 3
    tier_1_workflow: 8
    tier_2_agent_specific: 6
    tier_3_handoff: 1
  handoff_template: templates/handoff-context-tmpl.yaml
  mandatory_checklists:
    antipattern: checklists/funnel-audit-checklist.md
    secret_formula: checklists/secret-formula-checklist.md
    value_ladder: checklists/value-ladder-checklist.md

# Validation Scripts (Tools for Agents)
validation_scripts:
  funnel_data_validator:
    path: scripts/validate-funnel-data.py
    usage: "python squads/brunson/scripts/validate-funnel-data.py --inline 'secret_formula:Y,value_ladder:Y,...'"
    trigger: "Before any funnel design or architecture task"
    returns: "PASS (exit 0) or FAIL (exit 1)"

  handoff_validator:
    path: scripts/validate-handoff.py
    usage: "python squads/brunson/scripts/validate-handoff.py <file.yaml>"
    trigger: "Before any specialist-to-specialist handoff"
    returns: "PASS (exit 0) or FAIL (exit 1)"

  antipattern_validator:
    path: scripts/validate-antipattern.py
    usage: "python squads/brunson/scripts/validate-antipattern.py --interactive"
    trigger: "Before approving funnel for launch"
    returns: "PASS (exit 0) or VETO (exit 1)"
