# Workflows
workflows:
  - id: wf-funnel-architecture
    name: "Funnel Architecture Design"
    duration: "3-5 days"
    phases: 5
    agents_involved: [brunson-chief, brunson-funnels, brunson-pages, brunson-offers, brunson-advisor]

  - id: wf-perfect-webinar
    name: "Perfect Webinar Creation"
    duration: "2-3 days"
    phases: 4
    agents_involved: [brunson-chief, brunson-webinar, brunson-stories, brunson-offers]

  - id: wf-dream-100-campaign
    name: "Dream 100 Traffic Campaign"
    duration: "3-5 days"
    phases: 5
    agents_involved: [brunson-chief, brunson-traffic, brunson-hooks, brunson-copy]

  - id: wf-email-machine
    name: "Email Automation Machine"
    duration: "2-3 days"
    phases: 4
    agents_involved: [brunson-chief, brunson-email, brunson-copy]

  - id: wf-mass-movement
    name: "Mass Movement Builder"
    duration: "3-5 days"
    phases: 5
    agents_involved: [brunson-chief, brunson-movement, brunson-stories, brunson-expert]

  - id: wf-launch-sequence
    name: "Product Launch Sequence"
    duration: "5-7 days"
    phases: 6
    agents_involved: [brunson-chief, brunson-launch, brunson-webinar, brunson-email, brunson-hooks]

  - id: wf-funnel-audit
    name: "Funnel Audit & Optimization"
    duration: "1-2 days"
    phases: 3
    agents_involved: [brunson-chief, brunson-advisor, brunson-swipe]

  - id: wf-attractive-character
    name: "Attractive Character Builder"
    duration: "2-3 days"
    phases: 4
    agents_involved: [brunson-chief, brunson-stories, brunson-copy]

  - id: wf-funnel-hacking
    name: "Funnel Hacking Process"
    duration: "1-2 days"
    phases: 3
    agents_involved: [brunson-chief, brunson-swipe, brunson-funnels]

