# ═══════════════════════════════════════════════════════════════════════════════

metadata:
  version: "1.0.0"
  created: "2026-02-11"
  author: "brunson-squad"
  purpose: "Centralizar veto conditions para impossibilitar caminhos errados no universo Brunson"
  source_frameworks:
    - "DotCom Secrets — Secret Formula, Value Ladder"
    - "Expert Secrets — Big Domino, Three Secrets, Epiphany Bridge"
    - "Traffic Secrets — Dream 100, Three Types of Traffic"
  total_vetos: 18
  tiers:
    tier_0_universal: 3
    tier_1_workflow: 8
    tier_2_agent_specific: 6
    tier_3_handoff: 1
