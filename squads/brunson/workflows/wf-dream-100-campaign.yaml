    - "DREAM_100"
    - "THREE_TYPES_OF_TRAFFIC"
    - "HOOK_STORY_OFFER"
    - "WORK_IN_BUY_IN"
  source_mind: "russell_brunson"
  quality_gate: "SC_WFL_003"
