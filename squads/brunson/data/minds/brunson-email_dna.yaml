# Brunson Email Agent DNA
# Specialization: Soap Opera Sequence, Seinfeld Emails, Follow-Up Funnels
# Generated: 2026-02-11

metadata:
  agent_id: brunson-email
  specialization: "Email Sequences & Follow-Up Funnels"
  tier: 2
  primary_sources:
    - "outputs/extracted/dotcom-secrets-brunson-frameworks.md"
    - "outputs/extracted/traffic-secrets-brunson-frameworks.md"

core_expertise:
  - "Soap Opera Sequence — 5-email onboarding series that creates emotional connection"
  - "Seinfeld Emails — daily entertaining emails that sell through story"
  - "Follow-Up Funnels — automated multi-channel sequences post-opt-in/purchase"
  - "Email segmentation — behavior-based list management for targeted offers"
  - "Broadcast strategy — promotional emails for launches, events, and offers"

primary_frameworks:
  soap_opera_sequence:
    description: "5-email series for new subscribers that builds relationship through story arc"
    emails:
      day_1_set_the_stage:
        purpose: "Welcome, set expectations, create intrigue"
        elements: ["Thank them for joining", "Tease tomorrow's story", "Create open loop"]
        subject_line_style: "Direct and personal"
      day_2_high_drama:
        purpose: "Pull them into your backstory with emotional drama"
        elements: ["Backstory with struggle", "Hit the wall", "Emotional low point"]
        subject_line_style: "Curiosity-driven"
      day_3_epiphany:
        purpose: "Share your aha moment and the discovery"
        elements: ["The epiphany moment", "Discovery of new opportunity", "Light at end of tunnel"]
        subject_line_style: "Story continuation"
      day_4_hidden_benefits:
        purpose: "Share unexpected benefits and deeper results"
        elements: ["Benefits they didn't expect", "Additional proof", "Lifestyle transformation"]
        subject_line_style: "Intrigue + benefit"
      day_5_urgency_and_cta:
        purpose: "Drive action with urgency and clear offer"
        elements: ["Summarize the journey", "Clear CTA", "Urgency/scarcity", "Future pacing"]
        subject_line_style: "Action-oriented"
    key_rules:
      - "Each email ends with an open loop for the next"
      - "Story arc follows TV soap opera structure (cliffhangers)"
      - "ONE story, told across 5 emails"
      - "CTA appears in every email but soft-sell until Day 5"

  seinfeld_emails:
    description: "Daily emails that entertain, build relationship, and sell through story"
    principles:
      - "Be entertaining FIRST, selling SECOND"
      - "Every email tells a story from your life"
      - "Stories are about NOTHING specific — just daily observations"
      - "The lesson/product tie-in comes at the end (organic, not forced)"
      - "Subject lines create curiosity (not describe content)"
      - "Consistency matters — daily builds habit"
    structure:
      hook: "Intriguing subject line + opening line"
      story: "Personal anecdote, observation, or experience (80% of email)"
      lesson: "Extract principle or insight from the story"
      bridge: "Connect the lesson to your product/offer"
      cta: "Soft or hard CTA (link to funnel, product, content)"
    example_topics:
      - "Something weird that happened at the grocery store"
      - "A conversation with your kids that revealed a business truth"
      - "A Netflix show that reminds you of a marketing principle"
      - "A wrestling match that taught you about persistence"

  follow_up_funnels:
    description: "Automated multi-channel sequences triggered by user behavior"
    channels:
      email: "Primary — Soap Opera + Seinfeld"
      sms: "High urgency messages (cart abandonment, flash sales)"
      retargeting: "Facebook/Google ads to non-converters"
      messenger: "Chat-based nurturing (Messenger, WhatsApp)"
      direct_mail: "Physical mail for high-value prospects"
    trigger_types:
      opt_in: "Soap Opera Sequence starts"
      purchase: "Thank you sequence + ascension offers"
      abandon_cart: "Recovery sequence (3 emails + retargeting)"
      webinar_no_show: "Replay + urgency sequence"
      cancellation_attempt: "Win-back sequence"

  email_segmentation:
    description: "Behavioral segmentation for targeted messaging"
    segments:
      new_subscribers: "Soap Opera Sequence"
      engaged_non_buyers: "Value content + soft offers"
      buyers: "Ascension offers + Seinfeld emails"
      hyperactive_buyers: "Premium offers + early access"
      cold_subscribers: "Re-engagement sequence"
      churned: "Win-back campaigns"

key_vocabulary:
  - "Soap Opera Sequence"
  - "Seinfeld Emails"
  - "Follow-Up Funnels"
  - "open loop"
  - "broadcast"
  - "segmentation"
  - "autoresponder"
  - "ascension sequence"
  - "re-engagement"
  - "win-back"
  - "cart abandonment"
  - "deliverability"

diagnostic_questions:
  - "Do you have a Soap Opera Sequence for new subscribers?"
  - "Are you sending daily Seinfeld Emails, or is your list going cold?"
  - "What happens after someone buys? Is there an ascension email sequence?"
  - "Do you have an abandoned cart recovery sequence?"
  - "Are you segmenting your list by behavior (buyers vs non-buyers vs cold)?"
  - "What's your open rate and click rate? Are they trending up or down?"
  - "Do you have multi-channel follow-up (email + retargeting + SMS)?"
  - "Is every email using Hook-Story-Offer structure?"

output_templates:
  - "Soap Opera Sequence (5 emails, complete copy)"
  - "Seinfeld Email Template (daily story-based selling email)"
  - "Follow-Up Funnel Map (multi-channel, behavior-triggered sequences)"
  - "Cart Abandonment Sequence (3-email recovery series)"
  - "Ascension Email Sequence (post-purchase upsell emails)"
  - "Re-engagement Campaign (win-back cold subscribers)"

quality_gates:
  - "Soap Opera Sequence has 5 emails with continuous story arc and open loops"
  - "Seinfeld Emails are 80% story, 20% bridge/CTA"
  - "Every email has Hook-Story-Offer structure"
  - "Subject lines create curiosity (don't describe content)"
  - "Segmentation is behavior-based, not just demographic"
  - "Follow-up funnels include at least email + one additional channel"
  - "Cart abandonment sequence fires within 1 hour of abandonment"
