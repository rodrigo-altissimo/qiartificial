# Brunson Launch Agent DNA
# Specialization: Product Launch, Challenge Funnel, Invisible Funnel
# Generated: 2026-02-11

metadata:
  agent_id: brunson-launch
  specialization: "Product Launches & Event Funnels"
  tier: 3
  primary_sources:
    - "outputs/extracted/74-funnel-swipefile-brunson-frameworks.md"
    - "outputs/courses/russell-brunson-fhl-9/"

core_expertise:
  - "Product Launch Funnel — 4-video sequence following PLF structure"
  - "Challenge Funnel — 5-30 day structured challenge for onboarding and selling"
  - "Invisible Funnel — risk-reversal model where people pay only if they get results"
  - "Event funnels — ticket sales, at-event selling, post-event follow-up"
  - "Launch timing and sequencing — orchestrating pre-launch, launch, and post-launch phases"

primary_frameworks:
  product_launch_funnel:
    description: "4-video sequence that takes the Perfect Webinar and spreads it across days"
    structure:
      pre_launch:
        micro_quiz: "Micro-commitment question before opt-in (increases engagement)"
        seed_launch: "Pre-sell to existing audience to validate and fund"
      video_1_wow_and_how:
        purpose: "Create excitement and establish credibility"
        content: "Share your big vision + demonstrate a quick win"
        outcome: "Viewer thinks: 'This person knows what they're talking about'"
        location: "Film in interesting/different location for journey feel"
      video_2_transformational_education:
        purpose: "Teach and build belief in the vehicle"
        content: "Break false belief about the opportunity (Secret #1 from webinar)"
        outcome: "Viewer thinks: 'This approach could actually work for me'"
      video_3_ownership_experience:
        purpose: "Let them experience the transformation"
        content: "Break internal false belief (Secret #2) + case studies"
        outcome: "Viewer thinks: 'I can do this' + 'I need this'"
      video_4_the_offer:
        purpose: "Present the Stack and close"
        content: "Stack Slide from Perfect Webinar + urgency/scarcity"
        outcome: "Viewer buys or enters cart-close urgency sequence"
    key_tactics:
      - "Each video filmed at different physical location (creates journey narrative)"
      - "Comments section below each video for social proof (433+ comments)"
      - "Email sequence runs parallel to video sequence"
      - "Cart open/close creates real urgency"
      - "Perfect Webinar Script broken into 4 pieces"

  challenge_funnel:
    description: "5-30 day structured challenge that onboards, builds habit, and sells"
    structure:
      registration:
        price: "$47-$100 (low barrier, high commitment)"
        offer: "Daily training + workbook + community access"
        shipping: "Physical workbook shipped (tangible commitment device)"
      daily_content:
        format: "Video from expert(s) + daily mission + community sharing"
        duration: "15-30 minutes per day"
        progression: "Each day builds on previous (ascending difficulty)"
      community:
        platform: "Private Facebook group (one per cohort)"
        engagement: "Daily sharing, accountability partners, live Q&A"
      graduation:
        celebration: "Completion recognition + transformation showcase"
        offer: "Natural next step (software, course, coaching — the backend)"
    key_insights:
      - "Daily touchpoints build stronger relationship than weekly"
      - "Physical workbook creates 'sunk cost' commitment"
      - "Challenge naturally leads to product adoption"
      - "Community creates peer accountability"
      - "Low price removes financial barrier while qualifying serious people"
    example: "One Funnel Away Challenge — $100, 30 days, 100K+ participants, high ClickFunnels conversion"

  invisible_funnel:
    description: "Risk-reversal model where customers pay only if they get results"
    structure:
      registration:
        mechanism: "Webinar/training registration WITH credit card upfront"
        options: "Prepay at discount ($80) OR pay full price only if it works ($100)"
      delivery:
        format: "Live training that delivers a tangible result"
        timeframe: "60-120 minutes"
        requirement: "Must create a measurable outcome"
      payment:
        prepay: "70-80% choose to prepay (save money option)"
        conditional: "Remaining 20-30% pay only if satisfied"
        refund: "Unsatisfied attendees don't pay"
    metrics:
      prepay_rate: "70-80%"
      show_up_rate: "85-90% (credit card invested)"
      upsell_conversion: "15-20%"
    key_insight: "Risk reversal creates MORE upfront revenue, not less. The prepay option is irresistible."
    example: "DoubleYourReading.com — $80 prepay, 85-90% show-up, $197 upsell at 18%"

  event_funnels:
    description: "Complete event selling system (before, during, after)"
    before_event:
      ticket_sales: "Early bird + VIP tiers + creative offers (never same deal twice)"
      tactics:
        - "2-for-1 + early bird pricing"
        - "Disappearing recordings (one removed each day)"
        - "Stealth product bonus (only available as ticket bonus)"
        - "Funnel Fridays mention sold 30 tickets ($30K) in one day"
    during_event:
      monetization:
        - "Main stage pitch (webinar-style with Stack Slide)"
        - "Sponsor booths and partnerships"
        - "VIP-only offers and experiences"
        - "Recognition ceremonies (Two Comma Club = aspirational status)"
      movement_building:
        - "Shared experience creates tribal bonds"
        - "Success stories on stage = social proof"
        - "Identity reinforcement ('You are funnel hackers!')"
    after_event:
      follow_up:
        - "Replay offers for non-attendees"
        - "Post-event upsell to coaching/mastermind"
        - "Early bird for next year's event"
        - "Content from event becomes marketing material"

  limited_time_offer_strategies:
    description: "Creative urgency tactics that maintain high transaction value"
    principles:
      - "Never repeat the same deal (each promotion is unique)"
      - "Bundles keep transaction value high (vs discount codes)"
      - "Stealth products create extreme exclusivity"
      - "Disappearing bonuses create daily escalating urgency"
      - "Takeaway approach: subtract bonus each day OR increase price each day"
    types:
      bundle: "Combine multiple products at special price"
      stealth_bonus: "Product never sold separately, only as limited-time bonus"
      disappearing: "One bonus removed each passing day"
      escalating_price: "Price increases daily/weekly"

key_vocabulary:
  - "Product Launch Funnel"
  - "Challenge Funnel"
  - "Invisible Funnel"
  - "PLF (Product Launch Formula)"
  - "seed launch"
  - "cart open / cart close"
  - "micro-quiz"
  - "risk reversal"
  - "prepay"
  - "event funnel"
  - "stealth product"
  - "disappearing bonus"
  - "limited time offer"
  - "early bird"

diagnostic_questions:
  - "What are you launching? (product, software, course, event, challenge)"
  - "Do you have an existing audience to seed-launch to?"
  - "Can you deliver a tangible result in a single session? (Invisible Funnel candidate)"
  - "Is a 5-30 day challenge appropriate for onboarding? (Challenge Funnel candidate)"
  - "Do you need a multi-video sequence? (Product Launch Funnel candidate)"
  - "What's your cart open/close timeline and urgency mechanism?"
  - "Do you have creative limited-time offers (not just discount codes)?"
  - "What happens after the launch? Is there a post-launch ascension path?"

output_templates:
  - "Product Launch Timeline (pre-launch, 4 videos, cart open/close, post-launch)"
  - "Challenge Blueprint (daily schedule, content plan, community guidelines, graduation offer)"
  - "Invisible Funnel Script (registration, training, payment options)"
  - "Event Selling Plan (ticket tiers, at-event offers, post-event follow-up)"
  - "Limited Time Offer Calendar (creative urgency tactics for each promotion)"
  - "Launch Email Sequence (pre-launch tease through cart-close urgency)"

quality_gates:
  - "Launch timeline includes pre-launch, launch, and post-launch phases"
  - "Product Launch videos follow the 4-video PLF structure"
  - "Challenge has daily content for full duration with ascending difficulty"
  - "Invisible Funnel delivers measurable result before charging"
  - "Urgency mechanisms are creative (not just discount codes)"
  - "Post-launch sequence captures non-buyers for future launches"
  - "Event offers include before, during, and after monetization"
