  funnel_hacking_process:
    description: "Systematic method for reverse engineering any funnel"
    steps:
      step_1_discovery:
        action: "Find funnels making money in your niche (or adjacent)"
        tools: ["SimilarWeb", "BuiltWith", "Facebook Ad Library", "Google 'free book' + niche"]
      step_2_experience:
        action: "Go through the funnel as a customer — buy everything"
        capture: ["Screenshot every page", "Save every email", "Note every price point", "Time every sequence"]
      step_3_document:
        action: "Map the complete funnel architecture"
        elements: ["Page flow diagram", "Traffic sources", "Price points", "Copy elements", "Design choices"]
      step_4_analyze:
        action: "Identify the underlying framework and principles"
        questions: ["Why does this work?", "What archetype is this?", "What's the unique mechanism?", "What conversion tactics are used?"]
      step_5_adapt:
        action: "Rebuild with your own story, offer, and brand"
        rules: ["Model the framework, not the surface", "Add your unique mechanism", "Use your stories and proof", "Test and iterate"]

  conversion_tactics_library:
    description: "Specific micro-tactics proven to increase conversion (from 74 Funnel Swipefile)"
    tactics:
      attention:
        - "Flashing arrows pointing at key elements (REO Rockstar)"
        - "Auto-playing audio on squeeze pages (use cautiously)"
        - "Geo-targeted headlines ('Being that you're from [City]...')"
        - "Playing same video twice on landing page (Harmon Brothers test)"
      commitment:
        - "Micro-quiz before opt-in (micro-commitment)"
        - "Multi-step forms (delay personal info until invested)"
        - "Kit builder before payment (Dollar Beard Club)"
        - "Progress bar through funnel"
      conversion:
        - "Order bump adds 56% revenue on average"
        - "Default to higher quantity (FiberFix: default 9)"
        - "Video tutorial for order form = 75% more orders"
        - "Both button AND blue link for CTAs"
        - "Negative qualifiers on decline links"
        - "Red=no, Green=yes button psychology"
      urgency:
        - "60-minute countdown after quiz (Fabletics)"
        - "24-hour episode expiration (Truth About Cancer)"
        - "Disappearing bonuses (one removed each day)"
        - "Stealth products (never sold separately)"
        - "'Your Order Isn't Complete' progress bar"
      retention:
        - "Cancellation funnel saves 25-30% (ClickFunnels)"
        - "'Pause' not 'Cancel' option"
        - "Personalized video for each cancellation reason"
        - "Fear of loss reminder ('You still have 1 credit!')"
      pricing:
        - "Price decoy: 3 options with obvious best value"
        - "'Save money' upsell (Frank Kern: $297 instead of $397)"
        - "Trojan Horse continuity ($6-$7/mo too low to cancel)"
        - "'Was It The Price?' audio downsell"
      trust:
        - "Pre-testimonial page (when you don't have testimonials yet)"
        - "Remove branding on front-end (add back after opt-in)"
        - "Dynamic people-viewing counter"
        - "Facebook comments as social proof"

  pattern_matching:
    description: "Matching business types to proven funnel archetypes"
    decision_matrix:
      info_product: "Free+Shipping Book -> Webinar -> Coaching Application"
      saas: "Webinar Trial -> Monthly Sub -> Annual Prepay"
      ecommerce: "Quiz -> Customized Sales -> Quantity Upsells -> Subscription"
      coaching: "Content -> Application -> Phone Close -> Mastermind"
      local_business: "Quiz/Survey -> Free Consultation -> Service Sale"
      supplement: "VSL -> Free Trial -> Continuity -> Cross-sell"
      agency: "Summit/Content -> Application -> Retainer"

