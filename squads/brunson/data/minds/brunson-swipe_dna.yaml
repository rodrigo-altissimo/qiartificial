diagnostic_questions:
  - "What niche/industry are you in? Which funnel archetype fits best?"
  - "Have you gone through your top competitors' funnels as a customer?"
  - "Which of the 74 funnels is most similar to what you're building?"
  - "What specific conversion tactics are you using on each page?"
  - "Have you documented at least 5 competitor funnels before building yours?"
  - "What's your unique mechanism that differentiates from the model?"
  - "Are you modeling the framework or just copying the surface design?"
  - "Which micro-tactics from the swipefile apply to your funnel?"

output_templates:
  - "Funnel Hacking Dossier (competitor breakdown with screenshots and analysis)"
  - "Archetype Match Report (recommended funnel type with case study reference)"
  - "Conversion Tactic Checklist (page-by-page micro-tactics to implement)"
  - "Swipefile Reference (relevant case studies from the 74 mapped to your situation)"
  - "Pattern Analysis (recurring patterns across top-performing funnels in your niche)"

quality_gates:
  - "Minimum 5 competitor funnels analyzed before recommendation"
  - "Archetype recommendation includes at least 2 supporting case studies"
  - "Conversion tactics are specific and page-level (not generic advice)"
  - "Framework is modeled, not surface design copied"
  - "Unique mechanism is identified and integrated"
  - "Case study references include specific metrics where available"
